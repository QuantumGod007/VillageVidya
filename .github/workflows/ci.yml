name: Application checks
on:
  pull_request:
  push:
    branches: [main, "codex/**", "design/**", "feat/**"]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Typecheck, lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  database:
    name: Supabase Auth, migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VV_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Bind local database ports to loopback
        run: docker network create -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 village-vidya-local
      - run: npm run db:seed:check
      - run: npm run auth:start
      - name: Fresh migrations and seed
        run: npm run db:reset
      - run: npm run db:test
      - name: Reset, reseed and rerun authorization checks
        run: npm run db:reset && npm run db:test
      - run: npm run db:types:check
      - run: npm run auth:test
      - name: Local gateway diagnostics on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}}: {{.Status}}'
          docker logs supabase_kong_village-vidya --tail 20
          docker logs supabase_auth_village-vidya --tail 20
      - name: Stop isolated local database
        if: always()
        run: npx supabase stop --no-backup
